name: Build FamilyGuard Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: APK_Cloud_Build

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build FamilyGuard APK
        run: gradle --no-daemon assembleDebug

      - name: Upload FamilyGuard APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyGuard-Android-APK
          path: APK_Cloud_Build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
